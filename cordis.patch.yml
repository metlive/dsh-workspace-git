# dsh-workspace-git bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI —
#
#   dsh plugin --profile <name> add /path/to/dsh-workspace-git
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-workspace-git` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row). No profile file edits needed — one command installs and mounts.
#
# The host half needs the webserver (routes) and the session store (authoritative
# cwd per session). Both are provided by @deepseek-ai/dsh-base /
# @deepseek-ai/dsh-web-app, which precede this bundle in the layer stack.
- insert:
    - id: workspace-git
      name: 'dsh-workspace-git'
